name: Desktop release

# Builds the native Windows installer and attaches it to the GitHub Release for
# the pushed tag. DriverRadar is a Windows application: the engine is PowerShell,
# the PnP tree and pnputil, so there is nothing to package for macOS or Linux.
#
# Tag the release after scripts/publish.ps1 has created it (that script also
# uploads the portable ZIP and the classic Windows Setup.exe):
#
#   git tag v1.5.0
#   git push origin v1.5.0
#
# Or run this workflow by hand with an existing tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the installer to (for example v1.5.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Stage the engine and a bundled Node runtime
        run: node scripts/stage-desktop.js --platform win32 --arch x64

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: npx tauri build --bundles nsis

      # gh is preinstalled on the runner, and uploading directly keeps the asset
      # name exactly what the bundler produced instead of letting a wrapper
      # rebuild the project.
      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(
            find desktop/src-tauri/target -type f -name '*.exe' -path '*/bundle/nsis/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::The NSIS installer was not produced."
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep the installer as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: driverradar-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
