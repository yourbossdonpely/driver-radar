[package]
name = "driver-radar-desktop"
version = "1.5.2"
description = "DriverRadar — Windows driver scanner and updater"
authors = ["yourbossdonpely"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
